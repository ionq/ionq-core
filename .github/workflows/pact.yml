name: Pact — consumer contracts

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  contracts:
    name: contracts (cloud-pact)
    # Fork PRs cannot federate, so they skip.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # federate to octo-sts
    steps:
      # Advisory for now: neither step can fail the job, so an outage here never holds a PR.
      # To make the verdict blocking, fail the report step below on a non-pass.
      - name: Get a token for cloud-pact Actions
        id: sts
        continue-on-error: true
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: octo-sts.gh.ionq.co
          scope: ionq/pact
          identity: ionq-core-pact

      - name: Run in cloud-pact and wait for its verdict
        id: run
        if: ${{ steps.sts.outcome == 'success' }}
        continue-on-error: true
        uses: $/.github/actions/cloud-pact-contracts
        with:
          token: ${{ steps.sts.outputs.token }}

      - name: Report an advisory failure
        if: ${{ steps.sts.outcome != 'success' || steps.run.outcome != 'success' }}
        env:
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          RUN_URL: ${{ steps.run.outputs.run-url }}
        run: |
          echo "::warning::cloud-pact check did not pass (${CONCLUSION:-never started}): ${RUN_URL:-octo-sts federation failed}"
