name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  UV_FROZEN: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [[ "$TAG" == "$VERSION" ]] || { echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $VERSION"; exit 1; }
          if curl -sf "https://pypi.org/pypi/ionq-core/$VERSION/json" >/dev/null 2>&1; then
            echo "::error::Version $VERSION already exists on PyPI"
            exit 1
          fi
      - uses: $/.github/actions/setup-uv
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  can-i-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # federate to octo-sts
    steps:
      # Advisory for now, like pact.yml: an outage here never holds a release.
      - name: Get a token for cloud-pact Actions
        id: sts
        continue-on-error: true
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: octo-sts.gh.ionq.co
          scope: ionq/pact
          identity: ionq-core-pact
      - name: can-i-deploy ${{ github.ref_name }} to prod
        if: ${{ steps.sts.outcome == 'success' }}
        continue-on-error: true
        uses: $/.github/actions/cloud-pact-contracts
        with:
          token: ${{ steps.sts.outputs.token }}
          workflow: consumer-can-i-release.yaml
          release-tag: ${{ github.ref_name }}

  publish-pypi:
    needs: [build, can-i-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/ionq-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  record-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write # federate to octo-sts
    steps:
      # Advisory for now, like pact.yml: recording can be replayed by hand if this fails.
      - name: Get a token for cloud-pact Actions
        id: sts
        continue-on-error: true
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: octo-sts.gh.ionq.co
          scope: ionq/pact
          identity: ionq-core-pact
      - name: record-release ${{ github.ref_name }} in prod
        if: ${{ steps.sts.outcome == 'success' }}
        continue-on-error: true
        uses: $/.github/actions/cloud-pact-contracts
        with:
          token: ${{ steps.sts.outputs.token }}
          workflow: consumer-record-release.yaml
          release-tag: ${{ github.ref_name }}

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create or update GitHub Release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" --clobber dist/*
